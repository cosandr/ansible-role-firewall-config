---

- name: Install {{ firewall_frontend }}
  ansible.builtin.package:
    name: "{{ firewall_frontend }}"
    state: present
  notify: Start firewall frontend
  when:
    - firewall_frontend != ''
    - firewall_install

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Detect firewall in use
  ansible.builtin.include_tasks: detect.yml
  when: firewall_frontend == ''

- name: Configure {{ firewall_frontend }} declaratively
  ansible.builtin.include_tasks: "{{ firewall_frontend }}-declarative.yml"
  when: firewall_declarative_config

- name: Configure {{ firewall_frontend }}
  ansible.builtin.include_tasks: "{{ firewall_frontend }}.yml"
  when: not firewall_declarative_config
